# AWS Amplify build specification — Moonbar monorepo (apps/web = Next.js 14 SSR)
#
# Amplify Console setup:
#   Framework:   Next.js (auto-detected)
#   Monorepo:    yes — App root: apps/web
#
# Environment variables to set in Amplify Console before first deploy:
#   NEXT_PUBLIC_REGION                 AU | UK | NZ
#   NEXT_PUBLIC_SANITY_PROJECT_ID      from sanity.io project settings (use "placeholder" for preview)
#   NEXT_PUBLIC_SANITY_DATASET         production
#   SANITY_API_READ_TOKEN              viewer token from sanity.io → API → Tokens
#   NEXT_PUBLIC_SMS_KEYWORD            (leave unset until confirmed — SMS page stays dark)
#   NEXT_PUBLIC_SMS_NUMBER             (leave unset until confirmed — SMS page stays dark)

version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # Pin to Node 20 LTS — Next.js 14 requires 18.17+
            - nvm use 20
            - node -v
            - npm -v
            # Install all workspace dependencies from the monorepo root
            - npm ci --prefix ../..
        build:
          commands:
            # Build the Next.js app
            - npm run build
      artifacts:
        # Amplify's Next.js SSR mode reads the .next directory from here.
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - node_modules/**/*
          - .next/cache/**/*
    appRoot: apps/web
